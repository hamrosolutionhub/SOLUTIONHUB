    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
      /* Techy Circuit Background Pattern & Glows */
      .techy-bg {
        background-color: #030712;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 60%),
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 30px 30px, 30px 30px;
      }
      .glow-amber {
        box-shadow: 0 0 25px rgba(245, 158, 11, 0.2);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Smooth Preloader Scan Animation */
      @keyframes scanner {
        0% { left: -33%; }
        100% { left: 100%; }
      }
      .animate-scanner {
        animation: scanner 1.5s infinite ease-in-out;
      }
      
      /* Progress Bar Transitions */
      .progress-bar-fill {
        transition: width 0.3s ease-out;
      }
    </style>
</head>
<body class="techy-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">
    
    <div id="root">
        <!-- Failsafe Static HTML Preloader (Shows if React fails to mount) -->
        <div class="flex items-center justify-center min-h-screen bg-black/95 text-white p-4">
            <div class="text-center space-y-6 p-8 bg-zinc-950/95 border border-amber-500/40 rounded-3xl glow-amber max-w-sm w-full font-mono shadow-2xl relative overflow-hidden">
                <div class="w-16 h-16 bg-gradient-to-tr from-amber-600 to-amber-400 text-black rounded-2xl flex items-center justify-center mx-auto font-black text-2xl shadow-lg shadow-amber-500/30 animate-pulse">SH</div>
                <div class="space-y-2">
                    <h2 class="text-sm font-black tracking-widest text-white uppercase">SOLUTION HUB</h2>
                    <p class="text-[11px] text-amber-400 font-semibold tracking-wider">SYSTEM INITIALIZING...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // ⚠️ YOUR EXACT GOOGLE SCRIPT URL:
      const API_URL = "https://script.google.com/macros/s/AKfycbyxc0GtwCU_Gx2scVdTM6I38vml0Oza__Zftg13jDg5D_DiQp1rf2y2e3jxocxuKx2ZUQ/exec";

      // SVG Social Icons
      const SocialIcons = {
        Facebook: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>,

        YouTube: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>,
        TikTok: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.242V2h-3.445v13.672a2.896 2.896 0 0 1-5.201 1.743l-.002-.001.002.001a2.895 2.895 0 0 1 3.193-4.512v-3.529a6.332 6.332 0 0 0-5.184 6.223 6.355 6.355 0 0 0 6.355 6.355 6.355 6.355 0 0 0 6.355-6.355V8.657a8.21 8.21 0 0 0 4.796 1.506v-3.47a4.79 4.79 0 0 1-1.06-.007z"/></svg>,
        WhatsApp: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.198-.198.347-.764.966-.937 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
      };

      function App() {
        const [appLoading, setAppLoading] = useState(true);
        const [loadProgress, setLoadProgress] = useState(0);
        
        const [page, setPage] = useState('home');
        const [currentUser, setCurrentUser] = useState(null);
        
        // Modal States
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [showPasswordModal, setShowPasswordModal] = useState(false);
        const [loginCreds, setLoginCreds] = useState({ user: '', pass: '' });
        const [passCreds, setPassCreds] = useState({ oldPass: '', newPass: '', confirmPass: '' });
        
        // Custom Alerts
        const [customAlert, setCustomAlert] = useState({ show: false, msg: '', type: 'info' });
        const [customConfirm, setCustomConfirm] = useState({ show: false, msg: '', onConfirm: null });

        // Database States
        const [products, setProducts] = useState([]);
        const [downloads, setDownloads] = useState([]);
        const [team, setTeam] = useState([]);
        const [users, setUsers] = useState([]);
        const [settings, setSettings] = useState({
          whatsapp: '+9779769726479',
          phone: '+9779769726479',
          address: 'Jhapa Gaupalika - 5, Purano Sharanamati, Jhapa',
          email: 'hamrosolutionhub@gmail.com',
          mapLink: 'https://maps.app.goo.gl/rufnFrQQNA2mcvGJA',
          logo: '', facebook: '', instagram: '', youtube: '', tiktok: ''
        });

        // Filter States
        const [filter, setFilter] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');
        const [downloadFilter, setDownloadFilter] = useState('All');
        const [downloadSearch, setDownloadSearch] = useState('');
        const [selectedProduct, setSelectedProduct] = useState(null);

        // Edit States
        const [editingProduct, setEditingProduct] = useState(null);
        const [editingDownload, setEditingDownload] = useState(null);
        const [editingTeam, setEditingTeam] = useState(null);

        useEffect(() => {
          let progress = 0;
          const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 15) + 5;
            if (progress >= 90) {
                progress = 90; 
                clearInterval(interval);
            }
            setLoadProgress(progress);
          }, 150);

          fetch(API_URL + "?action=getData")
            .then(async res => {
                if(!res.ok) throw new Error("Network response not ok");
                const text = await res.text();
                try { return JSON.parse(text); } 
                catch(e) { throw new Error("Invalid JSON Data"); }
            })
            .then(data => {
              if (data.products && Array.isArray(data.products)) setProducts(data.products);
              if (data.downloads && Array.isArray(data.downloads)) setDownloads(data.downloads);
              if (data.team && Array.isArray(data.team)) setTeam(data.team);
              if (data.users && Array.isArray(data.users)) setUsers(data.users);
              if (data.settings && Object.keys(data.settings).length > 0) {
                  setSettings(prev => ({...prev, ...data.settings}));
              }
              
              setLoadProgress(100);
              setTimeout(() => setAppLoading(false), 500);
              clearInterval(interval);
            })
            .catch(err => {
              console.error("Fetch Error:", err);
              // Fail safe: Stop loading so app can still display
              setLoadProgress(100);
              setTimeout(() => {
                  setAppLoading(false);
                  showAlert("Could not connect to database. Showing offline view.", "error");
              }, 500);
              clearInterval(interval);
            });
            
          return () => clearInterval(interval);
        }, []);

        const showAlert = (msg, type = 'info') => setCustomAlert({ show: true, msg, type });
        const showConfirm = (msg, onConfirm) => setCustomConfirm({ show: true, msg, onConfirm });

        // Convert image to Base64 to send to backend seamlessly
        const handleImageFileChange = (e, stateSetter, currentState) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onloadend = () => stateSetter({...currentState, imageFileBase64: reader.result, image: reader.result});
                reader.readAsDataURL(file);
            }
        };

        const handleLogin = (e) => {
          e.preventDefault();
          const matched = users.find(u => (u.username === loginCreds.user || u.id === loginCreds.user) && String(u.password) === String(loginCreds.pass));
          if (matched) {
            setCurrentUser(matched);
            setShowLoginModal(false);
            setLoginCreds({user:'', pass:''});
            showAlert("Login Successful! Welcome Admin.", "success");
          } else {
            showAlert("Invalid User ID or Password!", "error");
          }
        };

        const handleChangePassword = async (e) => {
          e.preventDefault();
          if(passCreds.newPass !== passCreds.confirmPass) return showAlert("New Passwords do not match!", "error");
          showAlert("Updating password...", "info");
          try {
            const response = await fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'changePassword', payload: { username: currentUser.username, oldPass: passCreds.oldPass, newPass: passCreds.newPass } }) 
            });
            const result = await response.json();
            if(result.success) {
                showAlert("Password Changed Successfully!", "success");
                setShowPasswordModal(false);
                setPassCreds({oldPass:'', newPass:'', confirmPass:''});
            } else {
                showAlert(result.message || "Failed to update", "error");
            }
          } catch(e) {
            showAlert("Error updating password.", "error");
          }
        };

        const handleSaveAction = async (action, payload, stateSetter, successMsg) => {
          showAlert(`Saving ${successMsg}...`, "info");
          try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload }) });
            if(stateSetter) stateSetter(null);
            showAlert(`${successMsg} Saved Successfully!`, "success");
            
            // Refresh
            fetch(API_URL + "?action=getData").then(res=>res.json()).then(data => {
              if(action==='saveProduct' && data.products) setProducts(data.products);
              if(action==='saveDownload' && data.downloads) setDownloads(data.downloads);
              if(action==='saveTeam' && data.team) setTeam(data.team);
              if(action==='saveSettings' && data.settings) setSettings(prev => ({...prev, ...data.settings}));
            }).catch(()=>{});
          } catch(e) {
            showAlert(`Error saving ${successMsg}.`, "error");
          }
        };

        const handleDeleteAction = (action, id, type) => {
          showConfirm(`Are you sure you want to DELETE this ${type}?`, async () => {
            showAlert(`Deleting ${type}...`, "info");
            try {
              await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload: { id } }) });
              showAlert(`${type} Deleted.`, "success");
              // Refresh
              fetch(API_URL + "?action=getData").then(res=>res.json()).then(data => {
                  if(action==='deleteProduct' && data.products) setProducts(data.products);
                  if(action==='deleteDownload' && data.downloads) setDownloads(data.downloads);
                  if(action==='deleteTeam' && data.team) setTeam(data.team);
              }).catch(()=>{});
            } catch(e) {
              showAlert(`Error deleting ${type}.`, "error");
            }
          });
        };

        const filteredProducts = (products || []).filter(p => {
          if (!p || !p.name) return false;
          const matchesCat = filter === 'All' || p.category === filter;
          const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCat && matchesSearch;
        });

        const filteredDownloads = (downloads || []).filter(d => {
          if (!d || !d.name) return false;
          const matchesCat = downloadFilter === 'All' || d.category === downloadFilter;
          const matchesSearch = d.name.toLowerCase().includes(downloadSearch.toLowerCase());
          return matchesCat && matchesSearch;
        });

        const generateWaLink = (productOrText) => {
            const cleanNum = String(settings?.whatsapp || '+9779769726479').replace(/\D/g, '');
            if(typeof productOrText === 'string') {
                return `https://wa.me/${cleanNum}?text=${encodeURIComponent(productOrText)}`;
            }
            if(!productOrText) return '#';
            const waText = encodeURIComponent(`Hello Solution Hub, I want to purchase this item:\n- Product: ${productOrText.name}\n- Price: ${productOrText.price}`);
            return `https://wa.me/${cleanNum}?text=${waText}`;
        };

        if (appLoading) {
            return (
                <div className="flex items-center justify-center min-h-screen bg-black text-white p-4">
                    <div className="text-center space-y-6 p-8 bg-zinc-950 border border-amber-500/40 rounded-3xl glow-amber max-w-sm w-full font-mono shadow-2xl relative overflow-hidden">
                        <div className="w-16 h-16 bg-gradient-to-tr from-amber-600 to-amber-400 text-black rounded-2xl flex items-center justify-center mx-auto font-black text-2xl shadow-lg shadow-amber-500/30 animate-pulse">SH</div>
                        <div className="space-y-2">
                            <h2 className="text-sm font-black tracking-widest text-white uppercase">SOLUTION HUB</h2>
                            <p className="text-[11px] text-amber-400 font-semibold tracking-wider">SYSTEM INITIALIZING...</p>
                        </div>
                        <div className="space-y-2">
                            <div className="w-full h-1.5 bg-zinc-900 rounded-full overflow-hidden relative border border-amber-500/30">
                                <div className="absolute top-0 bottom-0 left-0 bg-gradient-to-r from-amber-600 via-amber-400 to-yellow-300 progress-bar-fill shadow-[0_0_10px_rgba(245,158,11,0.8)]" style={{ width: `${loadProgress}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[10px] text-gray-400 font-mono">
                                <span>LOADING SECURE DATA...</span>
                                <span className="text-amber-400 font-bold">{loadProgress}%</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        return (
          <div className="flex flex-col flex-grow w-full">
            
            {/* Custom Modals */}
            {customAlert.show && (
                <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                    <div className={`bg-zinc-900 border ${customAlert.type === 'error' ? 'border-rose-500/50' : 'border-amber-500/30'} rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl space-y-6`}>
                        <div className={`text-3xl ${customAlert.type === 'error' ? 'text-rose-500' : 'text-amber-400'}`}>
                            {customAlert.type === 'error' ? '⚠️' : customAlert.type === 'success' ? '✅' : 'ℹ️'}
                        </div>
                        <p className="text-white text-sm font-bold leading-relaxed">{customAlert.msg}</p>
                        <button onClick={() => setCustomAlert({show: false, msg: '', type: 'info'})} className="bg-zinc-800 text-white px-6 py-2 rounded-xl font-black uppercase text-xs shadow-lg hover:bg-zinc-700 transition w-full">OK</button>
                    </div>
                </div>
            )}
            
            {customConfirm.show && (
                <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                    <div className="bg-zinc-900 border border-rose-500/30 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl space-y-6">
                        <div className="text-3xl text-rose-500 mb-2">🛑</div>
                        <p className="text-white text-sm font-bold leading-relaxed">{customConfirm.msg}</p>
                        <div className="flex justify-center gap-3">
                            <button onClick={() => setCustomConfirm({show: false, msg: '', onConfirm: null})} className="flex-1 bg-zinc-800 text-gray-300 hover:text-white px-5 py-2.5 rounded-xl font-bold uppercase text-xs transition">Cancel</button>
                            <button onClick={() => { if(customConfirm.onConfirm) customConfirm.onConfirm(); setCustomConfirm({show: false, msg: '', onConfirm: null}); }} className="flex-1 bg-rose-600 text-white px-5 py-2.5 rounded-xl font-black uppercase text-xs shadow-lg hover:bg-rose-500 transition">Confirm</button>
                        </div>
                    </div>
                </div>
            )}

            {/* Header & Navigation */}
            <header className="bg-black/90 backdrop-blur-md shadow-2xl sticky top-0 z-40 border-b border-amber-500/20">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setPage('home')}>
                  {settings?.logo ? (
                    <img src={settings.logo} alt="Logo" className="w-11 h-11 rounded-2xl object-cover border border-amber-500/50 shadow-md bg-zinc-900" />
                  ) : (
                    <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-600 via-amber-500 to-yellow-300 text-black flex items-center justify-center font-black text-lg shadow-lg shadow-amber-500/20">SH</div>
                  )}
                  <div>
                    <h1 className="font-black text-base sm:text-lg leading-tight tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-100 to-amber-400 uppercase">SOLUTION HUB</h1>
                    <p className="text-[9px] sm:text-[10px] text-amber-400 tracking-widest font-bold uppercase hidden sm:block">INNOVATIVE SOLUTIONS | UNMATCHED SERVICES</p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  {currentUser && (
                      <div className="flex items-center gap-2">
                          <span className="text-xs text-amber-400 font-bold hidden sm:inline mr-2">👤 {currentUser.name || currentUser.username}</span>
                          <button onClick={() => setShowPasswordModal(true)} title="CHANGE PASSWORD" className="w-9 h-9 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-amber-400 flex items-center justify-center shadow transition group">
                              <svg className="w-4 h-4 group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                          </button>
                      </div>
                  )}
                  <button 
                    onClick={() => currentUser ? setCurrentUser(null) : setShowLoginModal(true)} 
                    title={currentUser ? "LOGOUT" : "ADMIN LOGIN"}
                    className="w-10 h-10 rounded-xl bg-gradient-to-tr from-zinc-900 to-zinc-800 hover:from-zinc-800 hover:to-zinc-700 border border-amber-500/30 text-amber-400 flex items-center justify-center shadow-lg transition transform active:scale-95 group"
                  >
                    <svg className="w-5 h-5 group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                  </button>
                </div>
              </div>

              <nav className="bg-zinc-950/95 border-t border-zinc-900/80 px-2 sm:px-4 py-2">

        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }
        render() {
          if (this.state.hasError) {
            return (
              <div className="flex items-center justify-center min-h-screen p-4 text-white">
                <div className="bg-rose-900/50 border border-rose-500 p-8 rounded-2xl max-w-lg text-center space-y-4">
                  <div className="text-4xl">⚠️</div>
                  <h1 className="font-black text-xl uppercase">Application Error</h1>
                  <p className="text-xs text-rose-300 font-mono p-4 bg-black/50 rounded-xl overflow-auto text-left">
                     {this.state.error.toString()}
                  </p>
                  <button onClick={() => window.location.reload()} className="bg-white text-black px-6 py-2 rounded-xl text-xs font-bold uppercase shadow-lg">Refresh Page</button>
                </div>
              </div>
            );
          }
          return this.props.children;
        }
      }

      ReactDOM.createRoot(document.getElementById('root')).render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLUTION HUB | ELECTRONIC, MOBILE REPAIR & TECH SUPPORT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .techy-bg {
        background-color: #030712;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 60%),
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 30px 30px, 30px 30px;
      }
      .glow-amber { box-shadow: 0 0 25px rgba(245, 158, 11, 0.2); }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 4px; }
      @keyframes scanner { 0% { left: -33%; } 100% { left: 100%; } }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="techy-bg text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // 🔴 UPDATE YOUR LATEST DEPLOYMENT URL HERE IF YOU DEPLOY A NEW SCRIPT 🔴
      const API_URL = "https://script.google.com/macros/s/AKfycbyxc0GtwCU_Gx2scVdTM6I38vml0Oza__Zftg13jDg5D_DiQp1rf2y2e3jxocxuKx2ZUQ/exec";

      const SocialIcons = {
        Facebook: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>,
        Instagram: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>,
        WhatsApp: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.198-.198.347-.764.966-.937 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>,
        YouTube: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>,
        TikTok: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.242V2h-3.445v13.672a2.896 2.896 0 0 1-5.201 1.743l-.002-.001.002.001a2.895 2.895 0 0 1 3.193-4.512v-3.529a6.332 6.332 0 0 0-5.184 6.223 6.355 6.355 0 0 0 6.355 6.355 6.355 6.355 0 0 0 6.355-6.355V8.657a8.21 8.21 0 0 0 4.796 1.506v-3.47a4.79 4.79 0 0 1-1.06-.007z"/></svg>
      };

      function App() {
        const [appState, setAppState] = useState({ loaded: false, progress: 0 });
        const [page, setPage] = useState('home');
        const [currentUser, setCurrentUser] = useState(null);
        
        // Modals & Authentication
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [loginCreds, setLoginCreds] = useState({ user: '', pass: '' });
        const [otpMode, setOtpMode] = useState(false);
        const [otpValue, setOtpValue] = useState('');
        const [showPassModal, setShowPassModal] = useState(false);
        const [passCreds, setPassCreds] = useState({ oldPass: '', newPass: '' });
        
        // Custom Notifications
        const [customAlert, setCustomAlert] = useState({ show: false, msg: '', type: 'info' });
        const [customConfirm, setCustomConfirm] = useState({ show: false, msg: '', onConfirm: null });

        // Database
        const [products, setProducts] = useState([]);
        const [downloads, setDownloads] = useState([]);
        const [team, setTeam] = useState([]);
        const [settings, setSettings] = useState({ whatsapp: '+9779769726479', address: '', email: '', mapLink: '', logo: '', facebook: '', instagram: '', tiktok: '', youtube: '' });
        const [users, setUsers] = useState([]);

        // Search & Filter
        const [filter, setFilter] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');
        const [downloadFilter, setDownloadFilter] = useState('All');
        const [downloadSearch, setDownloadSearch] = useState('');
        
        // Active Edits
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [activeDetailImage, setActiveDetailImage] = useState('');
        const [editingProduct, setEditingProduct] = useState(null);
        const [editingDownload, setEditingDownload] = useState(null);
        const [editingTeam, setEditingTeam] = useState(null);

        useEffect(() => {
          // Fast lightning loader effect (10ms interval)
          let perc = 0;
          const interval = setInterval(() => {
            perc += Math.floor(Math.random() * 5) + 1;
            if(perc > 90) perc = 90;
            setAppState(prev => ({ ...prev, progress: perc }));
          }, 20);

          fetch(API_URL + "?action=getData")
            .then(res => res.json())
            .then(data => {
              if (data.products) setProducts(data.products.filter(p => p && p.name));
              if (data.downloads) setDownloads(data.downloads.filter(d => d && d.name));
              if (data.team) setTeam(data.team.filter(t => t && t.name));
              if (data.settings) setSettings(data.settings);
              if (data.users) setUsers(data.users);
            })
            .catch(err => console.log("Fetch Error", err))
            .finally(() => {
              clearInterval(interval);
              setAppState({ loaded: true, progress: 100 });
            });
            
          return () => clearInterval(interval);
        }, []);

        const showAlert = (msg, type = 'info') => setCustomAlert({ show: true, msg, type });
        const showConfirm = (msg, onConfirm) => setCustomConfirm({ show: true, msg, onConfirm });

        const executeAction = async (action, payload) => {
            showAlert("Processing Data... Please Wait", "info");
            try {
                const req = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload }) });
                const res = await req.json();
                if(res.success) {
                    showAlert(res.message, "success");
                    // Reload Data
                    const newDataReq = await fetch(API_URL + "?action=getData");
                    const data = await newDataReq.json();
                    if (data.products) setProducts(data.products.filter(p => p && p.name));
                    if (data.downloads) setDownloads(data.downloads.filter(d => d && d.name));
                    if (data.team) setTeam(data.team.filter(t => t && t.name));
                    if (data.settings) setSettings(data.settings);
                } else {
                    showAlert(res.message || "Failed!", "error");
                }
                return res.success;
            } catch(e) {
                showAlert("Network Error!", "error");
                return false;
            }
        };

        const processImageFile = (file, isLogo = false) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = isLogo ? 1200 : 800; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
                        canvas.height = img.width > MAX_WIDTH ? img.height * scaleSize : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const mime = isLogo ? 'image/png' : 'image/jpeg';
                        resolve(canvas.toDataURL(mime, 0.85));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const handleImageFileChange = async (e, stateSetter, currentState, isLogo = false) => {
            const file = e.target.files[0];
            if(file) {
                const base64 = await processImageFile(file, isLogo);
                if(isLogo) {
                  stateSetter({...currentState, logoFileBase64: base64, logo: base64});
                } else {
                  stateSetter({...currentState, imageFileBase64: base64, image: base64});
                }
            }
        };

        const handleGalleryUpload = async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            showAlert("Compressing gallery images...", "info");
            const base64Array = await Promise.all(files.map(f => processImageFile(f, false)));
            setEditingProduct(prev => ({...prev, galleryFilesBase64: base64Array}));
            showAlert(`${base64Array.length} Extra Images Ready!`, "success");
        };

        const handleLoginStep1 = async (e) => {
          e.preventDefault();
          const matched = users.find(u => (u.username === loginCreds.user || u.id === loginCreds.user) && u.password === loginCreds.pass);
          if (matched) {
            showAlert("Generating OTP & Sending to Email...", "info");
            try {
                const req = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'requestOTP' }) });
                const res = await req.json();
                if(res.success) {
                    setOtpMode(true);
                    showAlert("OTP Sent to Admin Email!", "success");
                } else {
                    showAlert(res.message, "error");
                }
            } catch(e) {
                showAlert("Network error sending OTP", "error");
            }
          } else {
            showAlert("Invalid User ID or Password!", "error");
          }
        };

        const handleLoginStep2 = async (e) => {
            e.preventDefault();
            showAlert("Verifying OTP...", "info");
            try {
                const req = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyOTP', payload: { otp: otpValue } }) });
                const res = await req.json();
                if(res.success) {
                    const matched = users.find(u => (u.username === loginCreds.user || u.id === loginCreds.user));
                    setCurrentUser(matched);
                    setShowLoginModal(false);
                    setOtpMode(false);
                    setLoginCreds({ user: '', pass: '' });
                    setOtpValue('');
                    showAlert("Welcome securely, " + matched.name, "success");
                } else {
                    showAlert("Invalid or Expired OTP!", "error");
                }
            } catch(e) {
                showAlert("Network error verifying OTP", "error");
            }
        };

        const handleChangePass = (e) => {
          e.preventDefault();
          executeAction("changePassword", { username: currentUser.username, oldPass: passCreds.oldPass, newPass: passCreds.newPass });
          setShowPassModal(false);
          setPassCreds({oldPass: '', newPass: ''});
        };

        // Handlers
        const handleSaveProduct = (e) => { e.preventDefault(); executeAction('saveProduct', editingProduct); setEditingProduct(null); };
        const handleDeleteProduct = (id) => showConfirm("Delete this product completely?", () => executeAction('deleteProduct', {id}));
        const handleSaveDownload = (e) => { e.preventDefault(); executeAction('saveDownload', editingDownload); setEditingDownload(null); };
        const handleDeleteDownload = (id) => showConfirm("Delete this download?", () => executeAction('deleteDownload', {id}));
        const handleSaveTeam = (e) => { e.preventDefault(); executeAction('saveTeam', editingTeam); setEditingTeam(null); };
        const handleDeleteTeam = (id) => showConfirm("Remove team member?", () => executeAction('deleteTeam', {id}));
        const handleSaveSettings = (e) => { e.preventDefault(); executeAction('saveSettings', settings); };

        if (!appState.loaded) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-black/95 text-white p-4">
              <div className="text-center space-y-6 p-8 bg-zinc-950/95 border border-amber-500/40 rounded-3xl glow-amber max-w-sm w-full font-mono shadow-2xl relative overflow-hidden">
                  <div className="w-16 h-16 bg-gradient-to-tr from-amber-600 to-amber-400 text-white rounded-2xl flex items-center justify-center mx-auto font-black text-4xl shadow-[0_0_30px_rgba(245,158,11,0.6)] animate-pulse">
                      ⚡
                  </div>
                  <div className="space-y-2">
                      <h2 className="text-sm font-black tracking-widest text-white uppercase">SOLUTION HUB</h2>
                      <p className="text-[11px] text-amber-400 font-bold tracking-wider animate-pulse">ESTABLISHING CONNECTION...</p>
                  </div>
                  <div className="space-y-2">
                      <div className="w-full h-1.5 bg-zinc-900 rounded-full overflow-hidden relative border border-amber-500/30">
                          <div className="absolute top-0 bottom-0 bg-gradient-to-r from-amber-600 via-yellow-400 to-amber-400 transition-all duration-100 shadow-[0_0_10px_rgba(245,158,11,0.8)]" style={{width: `${appState.progress}%`}}></div>
                      </div>
                      <div className="flex justify-between text-[10px] text-gray-400 font-mono">
                          <span>LOADING...</span>
                          <span className="text-amber-400 font-bold">{appState.progress}%</span>
                      </div>
                  </div>
              </div>
            </div>
          );
        }

        const filteredProducts = products.filter(p => (filter === 'All' || p.category === filter) && p.name && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
        const filteredDownloads = downloads.filter(d => (downloadFilter === 'All' || d.category === downloadFilter) && d.name && d.name.toLowerCase().includes(downloadSearch.toLowerCase()));

        return (
          <div className="min-h-screen flex flex-col justify-between techy-bg text-gray-100 relative">
            
            {/* Custom Alert Notification */}
            {customAlert.show && (
              <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] bg-zinc-900 border border-zinc-700 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce">
                <span className={customAlert.type === 'error' ? 'text-rose-500 text-lg' : 'text-emerald-500 text-lg'}>{customAlert.type === 'error' ? '❌' : '✅'}</span>
                <span className="text-xs font-bold uppercase tracking-wider">{customAlert.msg}</span>
                <button onClick={()=>setCustomAlert({show:false, msg:''})} className="ml-4 text-gray-500 hover:text-white">✕</button>
              </div>
            )}

            {/* Custom Confirm Popup */}
            {customConfirm.show && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                <div className="bg-zinc-900 border border-amber-500/50 p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
                  <h3 className="font-black text-amber-400 uppercase tracking-wider">⚠️ CONFIRM ACTION</h3>
                  <p className="text-xs text-gray-300">{customConfirm.msg}</p>
                  <div className="flex gap-3 pt-2">
                    <button onClick={()=>setCustomConfirm({show:false})} className="flex-1 py-2 rounded-xl bg-zinc-800 text-white text-xs font-bold uppercase">CANCEL</button>
                    <button onClick={()=>{customConfirm.onConfirm(); setCustomConfirm({show:false});}} className="flex-1 py-2 rounded-xl bg-amber-500 text-black text-xs font-black uppercase shadow-lg">CONFIRM</button>
                  </div>
                </div>
              </div>
            )}

            {/* Header (Text Only Logo Always) */}
            <header className="bg-black/90 backdrop-blur-md shadow-2xl sticky top-0 z-40 border-b border-amber-500/20">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => window.location.reload()}>
                  <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-600 via-amber-500 to-yellow-300 text-black flex items-center justify-center font-black text-lg shadow-lg shadow-amber-500/20">SH</div>
                  <div>
                    <h1 className="font-black text-base sm:text-lg leading-tight tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-100 to-amber-400 uppercase">SOLUTION HUB</h1>
                    <p className="text-[9px] sm:text-[10px] text-amber-400 tracking-widest font-bold uppercase">INNOVATIVE SOLUTIONS | UNMATCHED SERVICES</p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  {currentUser && (
                    <div className="flex items-center gap-3">
                      <span className="text-[10px] bg-zinc-800 px-3 py-1 rounded-full text-amber-400 font-bold hidden sm:inline uppercase border border-amber-500/30">👤 {currentUser.name}</span>
                      <button onClick={()=>setShowPassModal(true)} className="text-[10px] font-bold text-gray-400 hover:text-white underline uppercase">Pass</button>
                    </div>
                  )}
                  
                  <button onClick={() => currentUser ? setCurrentUser(null) : setShowLoginModal(true)} title={currentUser ? "LOGOUT" : "ADMIN LOGIN"} className="w-10 h-10 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-amber-500/30 text-amber-400 flex items-center justify-center shadow-lg transition transform active:scale-95 group">
                    {currentUser ? '🚪' : <svg className="w-5 h-5 group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>}
                  </button>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="bg-zinc-950/95 border-t border-zinc-900/80 px-2 sm:px-4 py-2">
                <div className="max-w-7xl mx-auto flex items-center justify-start sm:justify-center gap-1.5 sm:gap-4 text-xs font-bold overflow-x-auto py-1 custom-scrollbar">
                  <button onClick={() => setPage('home')} className={`px-4 py-2 rounded-xl transition whitespace-nowrap uppercase tracking-wider shrink-0 ${page === 'home' ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg font-black' : 'text-gray-300 hover:text-amber-400 hover:bg-white/5'}`}>🏠 HOME</button>
                  <button onClick={() => setPage('shopping')} className={`px-4 py-2 rounded-xl transition whitespace-nowrap uppercase tracking-wider shrink-0 ${page === 'shopping' ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg font-black' : 'text-gray-300 hover:text-amber-400 hover:bg-white/5'}`}>🛍️ SHOPPING</button>
                  <button onClick={() => setPage('about')} className={`px-4 py-2 rounded-xl transition whitespace-nowrap uppercase tracking-wider shrink-0 ${page === 'about' ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg font-black' : 'text-gray-300 hover:text-amber-400 hover:bg-white/5'}`}>ℹ️ ABOUT US</button>
                  <button onClick={() => setPage('contact')} className={`px-4 py-2 rounded-xl transition whitespace-nowrap shrink-0 uppercase tracking-wider ${page === 'contact' ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg font-black' : 'text-gray-300 hover:text-amber-400 hover:bg-white/5'}`}>📞 CONTACT US</button>
                  <button onClick={() => setPage('download')} className={`px-4 py-2 rounded-xl transition whitespace-nowrap shrink-0 uppercase tracking-wider ${page === 'download' ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg font-black' : 'text-gray-300 hover:text-amber-400 hover:bg-white/5'}`}>📥 DOWNLOAD</button>
                </div>
              </nav>
            </header>

            <main className="flex-grow">
              
              {/* HOME PAGE */}
              {page === 'home' && (

                  <button onClick={() => setPage('contact')} className="hover:text-amber-400 transition">Contact</button>
                  <button onClick={() => setPage('download')} className="hover:text-amber-400 transition">Downloads</button>
                </div>

                <div className="flex gap-4 text-gray-400">
                  {settings.facebook && <a href={settings.facebook} target="_blank" className="hover:text-blue-500 hover:scale-110 transition"><SocialIcons.Facebook /></a>}
                  {settings.instagram && <a href={settings.instagram} target="_blank" className="hover:text-pink-500 hover:scale-110 transition"><SocialIcons.Instagram /></a>}
                  {settings.whatsapp && <a href={`https://wa.me/${String(settings.whatsapp).replace(/\D/g, '')}`} target="_blank" className="hover:text-emerald-500 hover:scale-110 transition"><SocialIcons.WhatsApp /></a>}
                  {settings.youtube && <a href={settings.youtube} target="_blank" className="hover:text-rose-500 hover:scale-110 transition"><SocialIcons.YouTube /></a>}
                  {settings.tiktok && <a href={settings.tiktok} target="_blank" className="hover:text-white hover:scale-110 transition"><SocialIcons.TikTok /></a>}
                </div>
              </div>

              <div className="max-w-7xl mx-auto text-center text-[10px] text-zinc-600 border-t border-zinc-900 pt-6 tracking-widest font-bold">
                <p>&copy; {new Date().getFullYear()} SOLUTION HUB. ALL RIGHTS RESERVED.</p>
              </div>
            </footer>
          </div>
        );
      }

      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      
      class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError: false }; }
        static getDerivedStateFromError(error) { return { hasError: true }; }
        componentDidCatch(error, errorInfo) { console.error("Crash Protection Active:", error, errorInfo); }
        render() {
          if (this.state.hasError) {
            return (
              <div className="min-h-screen bg-zinc-950 flex flex-col items-center justify-center text-white text-center p-6 space-y-4">
                <span className="text-5xl">⚠️</span>
                <h1 className="text-xl font-black text-amber-500 uppercase">System Integrity Restored</h1>
                <p className="text-xs text-gray-400 max-w-md">The application encountered a data mismatch and prevented a crash. Please refresh the page.</p>
                <button onClick={() => window.location.reload()} className="px-6 py-2 bg-amber-500 text-black text-xs font-black uppercase rounded-lg shadow-lg">Reload Interface</button>
              </div>
            );
          }
          return this.props.children; 
        }
      }

      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    </script>
</body>
</html>

      .techy-bg {
        background-color: #030712;
        background-image: 
          radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),

      const SocialIcons = {

        WhatsApp: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.198-.198.347-.764.966-.937 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>,
        YouTube: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>,
        TikTok: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.242V2h-3.445v13.672a2.896 2.896 0 0 1-5.201 1.743l-.002-.001.002.001a2.895 2.895 0 0 1 3.193-4.512v-3.529a6.332 6.332 0 0 0-5.184 6.223 6.355 6.355 0 0 0 6.355 6.355 6.355 6.355 0 0 0 6.355-6.355V8.657a8.21 8.21 0 0 0 4.796 1.506v-3.47a4.79 4.79 0 0 1-1.06-.007z"/></svg>,
        Share: () => <svg className="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>,
        XTwitter: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>,
        Telegram: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.008-1.252-.241-1.865-.44-.752-.244-1.349-.374-1.297-.789.027-.216.324-.437.892-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.119.098.152.228.166.321.016.109.032.339.018.528z"/></svg>
      };

      // Component: Animated Counter
      const AnimatedCounter = ({ target, label }) => {
        const [count, setCount] = useState(0);
        useEffect(() => {
          let start = 0; const duration = 2000; const increment = target / (duration / 16);
          const timer = setInterval(() => {
            start += increment;
            if (start >= target) { clearInterval(timer); setCount(target); }
            else setCount(Math.ceil(start));
          }, 16);
          return () => clearInterval(timer);
        }, [target]);
        return (
          <div className="space-y-1 p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-zinc-800 last:border-none">
            <span className="text-4xl sm:text-5xl font-black text-amber-400">{count}+</span>
            <h5 className="text-[10px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider mt-2">{label}</h5>
          </div>
        );
      };

      function App() {
        const [page, setPage] = useState('home');
        
        // Auth & UI States
        const [currentUser, setCurrentUser] = useState(null);
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [loginCreds, setLoginCreds] = useState({ user: '', pass: '' });
        const [otpMode, setOtpMode] = useState(false);
        const [otpValue, setOtpValue] = useState('');
        const [showPassModal, setShowPassModal] = useState(false);
        const [passCreds, setPassCreds] = useState({ oldPass: '', newPass: '' });
        
        const [customAlert, setCustomAlert] = useState({ show: false, msg: '', type: 'info' });
        const [customConfirm, setCustomConfirm] = useState({ show: false, msg: '', onConfirm: null });

        // Database
        const [products, setProducts] = useState([]);
        const [ads, setAds] = useState([]);
        const [servicesDb, setServicesDb] = useState([]);
        const [blogsDb, setBlogsDb] = useState([]);
        const [galleryDb, setGalleryDb] = useState([]);
        const [team, setTeam] = useState([]);
        const [downloads, setDownloads] = useState([]);
        
        // Settings State (Merged to prevent clearing)
        const [settings, setSettings] = useState({ 
          whatsapp: '', address: '', email: '', mapLink: '', logo: '', facebook: '', instagram: '', tiktok: '', youtube: '',
          slideshowSource: 'ads', slideshowPages: 'both', slideshowBuyBtn: 'true',
          metric_projects: 150, metric_clients: 1200, metric_years: 5, metric_support: 100
        });

        // Slideshow controls
        const [currentSlide, setCurrentSlide] = useState(0);
        const [isSlidePaused, setIsSlidePaused] = useState(false);

        // Filters & Search
        const [filter, setFilter] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');
        const [downloadFilter, setDownloadFilter] = useState('All');
        const [downloadSearch, setDownloadSearch] = useState('');
        
        // Active Modals & Edits
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [activeDetailImage, setActiveDetailImage] = useState('');
        const [shareProduct, setShareProduct] = useState(null);
        const [selectedBlog, setSelectedBlog] = useState(null);
        
        const [editingProduct, setEditingProduct] = useState(null);
        const [editingService, setEditingService] = useState(null);
        const [editingBlog, setEditingBlog] = useState(null);
        const [editingGallery, setEditingGallery] = useState(null);
        const [editingAd, setEditingAd] = useState(null);
        const [editingTeam, setEditingTeam] = useState(null);
        const [editingDownload, setEditingDownload] = useState(null);
        const [showSettingsModal, setShowSettingsModal] = useState(false);

        // Parallax Scroll Offset
        const [scrollOffset, setScrollOffset] = useState(0);

        // ==========================================
        // ROUTING ENGINE
        // ==========================================
        const navigateTo = (targetPage, push = true) => {
          let route = targetPage.startsWith('/') ? targetPage : '/' + targetPage;
          if (route === '/home') route = '/';
          if (push) window.history.pushState({ page: targetPage }, '', route);
          handleRouteChange(targetPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const handleRouteChange = (targetPage) => {
          let cleanPage = targetPage.replace(/^\/+/, '');
          setPage(cleanPage || 'home');
          if(cleanPage === 'blog' && selectedBlog) setSelectedBlog(null); 
          if(cleanPage === 'shopping' && selectedProduct) setSelectedProduct(null);

          let title = "Solution Hub | Electronic, Mobile Repair & Web Dev";
          let desc = "Your ultimate high-tech destination for mobile repair, web development, photo studio, and accessories.";
          if (cleanPage === 'shopping') { title = "Shopping Store | Solution Hub"; desc = "Explore our quality items, earbuds, chargers, and tech accessories."; }
          else if (cleanPage === 'services') { title = "Our Services | Solution Hub"; }
          else if (cleanPage === 'about') { title = "About Us | Solution Hub"; }
          else if (cleanPage === 'contact') { title = "Contact Us | Solution Hub"; }
          else if (cleanPage === 'blog') { title = "Tech Blog & Updates | Solution Hub"; }
          else if (cleanPage === 'gallery') { title = "Portfolio & Gallery | Solution Hub"; }
          else if (cleanPage === 'download') { title = "Software & Utility Downloads | Solution Hub"; }
          
          document.title = title;
          const metaDesc = document.getElementById('meta-desc'); if(metaDesc) metaDesc.content = desc;
        };

        useEffect(() => {
          const handleScroll = () => setScrollOffset(window.scrollY);
          window.addEventListener('scroll', handleScroll, { passive: true });

          const params = new URLSearchParams(window.location.search);
          const redirectedPath = params.get('p');
          if (redirectedPath) window.history.replaceState({}, '', redirectedPath);

          const pathname = window.location.pathname;
          let currentRoute = pathname === '/' ? 'home' : pathname.replace(/^\/+/, '');
          handleRouteChange(currentRoute);

          const onPopState = () => handleRouteChange(window.location.pathname === '/' ? 'home' : window.location.pathname.replace(/^\/+/, ''));
          window.addEventListener('popstate', onPopState);

          fetch(API_URL + "?action=getData").then(res => res.json()).then(data => {
              if (data.products) setProducts(data.products.filter(p => p && p.name));
              if (data.ads) setAds(data.ads.filter(a => a && a.title));
              if (data.services) setServicesDb(data.services.filter(s => s && s.title));
              if (data.blogs) setBlogsDb(data.blogs.filter(b => b && b.title));
              if (data.gallery) setGalleryDb(data.gallery.filter(g => g && g.title));
              if (data.team) setTeam(data.team.filter(t => t && t.name));
              if (data.downloads) setDownloads(data.downloads.filter(d => d && d.name));
              if (data.settings) setSettings(prev => ({...prev, ...data.settings})); // Merge safely
          }).catch(err => console.log("Fetch Error", err));

          return () => {
            window.removeEventListener('scroll', handleScroll);
            window.removeEventListener('popstate', onPopState);
          };
        }, []);

        const openProductModal = (prod) => {
          setSelectedProduct(prod);
          setActiveDetailImage(prod.image);
        };

        const showAlert = (msg, type = 'info') => setCustomAlert({ show: true, msg, type });
        const showConfirm = (msg, onConfirm) => setCustomConfirm({ show: true, msg, onConfirm });

        const executeAction = async (action, payload) => {
            showAlert("Processing Data...", "info");
            try {
                const req = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: currentUser ? currentUser.token : null, payload }) });
                const res = await req.json();
                if(res.success) {
                    showAlert(res.message, "success");
                    const dataReq = await fetch(API_URL + "?action=getData");
                    const data = await dataReq.json();
                    if (data.products) setProducts(data.products);
                    if (data.ads) setAds(data.ads);
                    if (data.services) setServicesDb(data.services);
                    if (data.blogs) setBlogsDb(data.blogs);
                    if (data.gallery) setGalleryDb(data.gallery);
                    if (data.team) setTeam(data.team);
                    if (data.downloads) setDownloads(data.downloads);
                    if (data.settings) setSettings(prev => ({...prev, ...data.settings}));
                } else showAlert(res.message || "Failed!", "error");
                return res.success;
            } catch(e) { showAlert("Network Error!", "error"); return false; }
        };

        const processImageFile = (file) => new Promise((res) => {
            const reader = new FileReader();
            reader.onloadend = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; const scale = MAX_WIDTH / img.width;
                    canvas.width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
                    canvas.height = img.width > MAX_WIDTH ? img.height * scale : img.height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    res(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        const handleImageFileChange = async (e, stateSetter, currentState) => {
            const file = e.target.files[0];
            if(file) {
                const base64 = await processImageFile(file);
                stateSetter({...currentState, imageFileBase64: base64, image: base64, logo: base64});
            }
        };

        // ------------------ LOGIN LOGIC ------------------
        const handleLoginStep1 = async (e) => {
          e.preventDefault(); showAlert("Verifying...", "info");
          const req = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'requestOTP', payload: loginCreds }) });
          const res = await req.json();
          if(res.success) { setOtpMode(true); showAlert("OTP Sent to Email!", "success"); } else showAlert(res.message, "error");
        };

        const handleLoginStep2 = async (e) => {
            e.preventDefault(); showAlert("Verifying OTP...", "info");
            const req = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyOTP', payload: { otp: otpValue } }) });
            const res = await req.json();
            if(res.success) {
                setCurrentUser({ name: res.name, username: res.username, token: res.token });
                setShowLoginModal(false); setOtpMode(false); setLoginCreds({user:'', pass:''}); setOtpValue('');
                showAlert("Welcome Admin", "success");
            } else showAlert(res.message, "error");
        };

        const handleChangePass = (e) => {
          e.preventDefault();
          executeAction("changePassword", { username: currentUser.username, oldPass: passCreds.oldPass, newPass: passCreds.newPass });
          setShowPassModal(false); setPassCreds({oldPass: '', newPass: ''});
        };

        // ------------------ SLIDESHOW LOGIC ------------------
        const isSlideshowActive = (settings.slideshowPages === 'both' && (page === 'home' || page === 'shopping')) ||
                                  (settings.slideshowPages === 'home' && page === 'home') ||
                                  (settings.slideshowPages === 'shopping' && page === 'shopping');
        
        let slideItems = [];
        if (settings.slideshowSource === 'recent') {
            slideItems = [...products].reverse().slice(0, 5).map(p => ({
                id: p.id, title: p.name, desc: p.description, mediaType: 'image', mediaUrl: p.image, 
                buyNowUrl: settings.slideshowBuyBtn === 'true' ? `https://wa.me/${String(settings.whatsapp).replace(/\D/g, '')}?text=${encodeURIComponent(`I want to buy: ${p.name}`)}` : null,
                detailsUrl: null, prodRef: p
            }));
        } else {
            slideItems = ads.filter(a => String(a.status).toLowerCase() === 'active').sort((a,b) => (a.order||0) - (b.order||0));
        }

        useEffect(() => {
          if (!isSlideshowActive || slideItems.length <= 1 || isSlidePaused) return;
          const timer = setInterval(() => setCurrentSlide(prev => (prev + 1) % slideItems.length), 5000);
          return () => clearInterval(timer);
        }, [isSlideshowActive, slideItems.length, isSlidePaused]);

        // ------------------ RENDER UI ------------------
        const filteredProducts = products.filter(p => (filter === 'All' || p.category === filter) && p.name && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
        const filteredDownloads = downloads.filter(d => (downloadFilter === 'All' || d.category === downloadFilter) && d.name && d.name.toLowerCase().includes(downloadSearch.toLowerCase()));

        return (
          <div className="flex-grow flex flex-col relative z-0">
            {/* Custom Alert */}
            {customAlert.show && (
              <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] bg-zinc-900 border border-zinc-700 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce">
                <span className={customAlert.type === 'error' ? 'text-rose-500 text-lg' : 'text-emerald-500 text-lg'}>{customAlert.type === 'error' ? '❌' : '✅'}</span>
                <span className="text-xs font-bold uppercase tracking-wider">{customAlert.msg}</span>
                <button onClick={()=>setCustomAlert({show:false, msg:''})} className="ml-4 text-gray-500 hover:text-white">✕</button>
              </div>
            )}

            {/* Custom Confirm */}
            {customConfirm.show && (

                      <form onSubmit={handleLoginStep1} className="space-y-4 text-xs">
                        <input type="text" required placeholder="Username" value={loginCreds.user} onChange={e=>setLoginCreds({...loginCreds, user:e.target.value})} className="w-full p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white outline-none focus:border-amber-500" />
                        <input type="password" required placeholder="Password" value={loginCreds.pass} onChange={e=>setLoginCreds({...loginCreds, pass:e.target.value})} className="w-full p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white outline-none focus:border-amber-500" />
                        <button type="submit" className="w-full bg-amber-500 text-black py-4 rounded-xl font-black uppercase">SEND OTP</button>
                      </form>
                  ) : (
                      <form onSubmit={handleLoginStep2} className="space-y-4 text-xs">
                        <input type="text" required placeholder="Enter 6-Digit OTP" value={otpValue} onChange={e=>setOtpValue(e.target.value)} className="w-full p-3.5 bg-zinc-950 border border-emerald-500/50 rounded-xl text-white outline-none text-center font-black text-lg tracking-widest" maxLength="6" />
                        <button type="submit" className="w-full bg-emerald-500 text-white py-4 rounded-xl font-black uppercase">VERIFY LOGIN</button>
                      </form>
                  )}
                </div>
              </div>
            )}
            
            {showPassModal && (
              <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="bg-zinc-900 border border-emerald-500/30 rounded-3xl max-w-sm w-full p-8 space-y-6 relative">
                  <button onClick={() => setShowPassModal(false)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-zinc-800 text-gray-400 hover:text-white font-bold transition">✕</button>
                  <h3 className="font-black text-lg text-white uppercase text-center">CHANGE PASSWORD</h3>
                  <form onSubmit={handleChangePass} className="space-y-4 text-xs">
                    <input type="password" required placeholder="Current Password" value={passCreds.oldPass} onChange={e=>setPassCreds({...passCreds, oldPass:e.target.value})} className="w-full p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white" />
                    <input type="password" required placeholder="New Password" minLength="6" value={passCreds.newPass} onChange={e=>setPassCreds({...passCreds, newPass:e.target.value})} className="w-full p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white" />
                    <button type="submit" className="w-full bg-emerald-500 text-white py-4 rounded-xl font-black uppercase">UPDATE SECRETS</button>
                  </form>
                </div>
              </div>
            )}

            {/* FOOTER */}
            <footer className="bg-black text-white py-8 px-4 border-t border-zinc-800/80 space-y-6 relative z-10">
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigateTo('home')}>
                  {settings.logo ? (
                    <img src={settings.logo} alt="Solution Hub Logo" className="h-12 sm:h-16 w-auto max-w-[220px] object-contain drop-shadow-md" />
                  ) : (
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-400 text-black flex items-center justify-center font-black text-xl shadow-lg shadow-amber-500/20">SH</div>
                  )}
                </div>
                
                <div className="flex flex-wrap justify-center gap-4 sm:gap-6 text-[10px] font-bold uppercase tracking-widest text-gray-400">
                  <button onClick={() => navigateTo('home')} className="hover:text-amber-400 transition">Home</button>
                  <button onClick={() => navigateTo('shopping')} className="hover:text-amber-400 transition">Shopping</button>
                  <button onClick={() => navigateTo('services')} className="hover:text-amber-400 transition">Services</button>
                  <button onClick={() => navigateTo('about')} className="hover:text-amber-400 transition">About</button>
                  <button onClick={() => navigateTo('contact')} className="hover:text-amber-400 transition">Contact</button>
                  <button onClick={() => navigateTo('blog')} className="hover:text-amber-400 transition">Blog</button>
                  <button onClick={() => navigateTo('gallery')} className="hover:text-amber-400 transition">Gallery</button>
                  <button onClick={() => navigateTo('download')} className="hover:text-amber-400 transition">Downloads</button>
                </div>

                <div className="flex gap-4 text-gray-400">
                  {settings.facebook && <a href={settings.facebook} target="_blank" className="hover:text-blue-500 hover:scale-110 transition"><SocialIcons.Facebook/></a>}
                  {settings.instagram && <a href={settings.instagram} target="_blank" className="hover:text-pink-500 hover:scale-110 transition"><SocialIcons.Instagram/></a>}
                  {settings.whatsapp && <a href={`https://wa.me/${String(settings.whatsapp).replace(/\D/g, '')}`} target="_blank" className="hover:text-emerald-500 hover:scale-110 transition"><SocialIcons.WhatsApp/></a>}
                  {settings.youtube && <a href={settings.youtube} target="_blank" className="hover:text-rose-500 hover:scale-110 transition"><SocialIcons.YouTube/></a>}
                  {settings.tiktok && <a href={settings.tiktok} target="_blank" className="hover:text-white hover:scale-110 transition"><SocialIcons.TikTok/></a>}
                </div>
              </div>
              <div className="max-w-7xl mx-auto text-center text-[10px] text-zinc-600 border-t border-zinc-900 pt-6 tracking-widest font-bold">
                <p>&copy; {new Date().getFullYear()} SOLUTION HUB. ALL RIGHTS RESERVED.</p>
              </div>
            </footer>
          </div>
        );
      }
      
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App/>);
    </script>
</body>
</html>

      };

      function App() {
        // Core App States
        const [appLoading, setAppLoading] = useState(true);
        const [loadProgress, setLoadProgress] = useState(0);
        const [page, setPage] = useState('home');
        
        // Data States initialized with Fallbacks safely
        const [products, setProducts] = useState(fallbackProducts);
        const [downloads, setDownloads] = useState(fallbackDownloads);
        const [team, setTeam] = useState(fallbackTeam);
        const [settings, setSettings] = useState({
          whatsapp: '+9779769726479',
          address: 'Jhapa Gaupalika - 5, Purano Sharanamati, Jhapa',
          email: 'hamrosolutionhub@gmail.com',
          mapLink: 'https://maps.app.goo.gl/rufnFrQQNA2mcvGJA',
          logo: ''
        });
        const [users, setUsers] = useState([{ id: 'admin_1', username: 'admin', password: 'admin123', name: 'Admin' }]);

        // User & Auth State
        const [currentUser, setCurrentUser] = useState(null);
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [loginCreds, setLoginCreds] = useState({ user: '', pass: '' });

        // Filter States
        const [filter, setFilter] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');
        const [downloadFilter, setDownloadFilter] = useState('All');
        const [downloadSearch, setDownloadSearch] = useState('');

        // Modals & Editing States
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [editingProduct, setEditingProduct] = useState(null);
        const [editingDownload, setEditingDownload] = useState(null);
        const [editingTeam, setEditingTeam] = useState(null);

        // Custom Custom Modals (No alerts!)
        const [toastMsg, setToastMsg] = useState('');
        const [confirmDialog, setConfirmDialog] = useState(null);

        useEffect(() => {
          // Preloader Animation
          let progress = 0;
          const progressInterval = setInterval(() => {
            progress += 15;
            if (progress >= 90) clearInterval(progressInterval);
            setLoadProgress(progress);
          }, 100);

          // Fetch live data securely
          fetch(API_URL + "?action=getData")
            .then(res => res.json())
            .then(data => {
              if (data.products && Array.isArray(data.products) && data.products.length > 0) setProducts(data.products);
              if (data.downloads && Array.isArray(data.downloads) && data.downloads.length > 0) setDownloads(data.downloads);
              if (data.team && Array.isArray(data.team) && data.team.length > 0) setTeam(data.team);
              if (data.settings && Object.keys(data.settings).length > 0) setSettings(data.settings);
              if (data.users && Array.isArray(data.users) && data.users.length > 0) setUsers(data.users);
            })
            .catch(err => console.log("Using default local data."))
            .finally(() => {
              clearInterval(progressInterval);
              setLoadProgress(100);
              setTimeout(() => setAppLoading(false), 500); // Hide preloader smoothly
            });
        }, []);

        const showToast = (msg) => {
            setToastMsg(msg);
            setTimeout(() => setToastMsg(''), 3000);
        };

        const requireConfirm = (msg, actionCallback) => {
            setConfirmDialog({ message: msg, onConfirm: actionCallback });
        };

        const fetchAllDataSilent = () => {
          fetch(API_URL + "?action=getData").then(res=>res.json()).then(data => {
              if (data.products?.length) setProducts(data.products);
              if (data.downloads?.length) setDownloads(data.downloads);
              if (data.team?.length) setTeam(data.team);
              if (data.settings) setSettings(data.settings);
          }).catch(()=>{});
        };

        const handleLogin = (e) => {
          e.preventDefault();
          const matched = users.find(u => (u.username === loginCreds.user || u.id === loginCreds.user) && u.password === loginCreds.pass);
          if (matched) {
            setCurrentUser(matched);
            setShowLoginModal(false);
            showToast(`Welcome back, ${matched.name || 'Admin'}!`);
          } else {
            showToast("Invalid Credentials!");
          }
        };

        // --- Database Actions ---
        const handleSaveProduct = async (e) => {
          e.preventDefault();
          showToast("Saving product...");
          try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveProduct', payload: editingProduct }) });
            setEditingProduct(null);
            showToast("Product saved successfully!");
            fetchAllDataSilent();
          } catch(err) { showToast("Error saving product."); }
        };

        const handleDeleteProduct = (id) => {
          requireConfirm("Delete this product permanently?", async () => {
            showToast("Deleting...");
            setConfirmDialog(null);
            try {
              await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteProduct', payload: { id } }) });
              showToast("Product deleted!");
              fetchAllDataSilent();
            } catch(err) { showToast("Error deleting product."); }
          });
        };

        const handleSaveDownload = async (e) => {
          e.preventDefault();
          showToast("Saving link...");
          try {
              await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveDownload', payload: editingDownload }) });
              setEditingDownload(null);
              showToast("Download saved!");
              fetchAllDataSilent();
          } catch(err) { showToast("Error saving download."); }
        };

        const handleDeleteDownload = (id) => {
          requireConfirm("Delete this download link?", async () => {
            showToast("Deleting...");
            setConfirmDialog(null);
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteDownload', payload: { id } }) });
                showToast("Download removed!");
                fetchAllDataSilent();
            } catch(err) { showToast("Error deleting."); }
          });
        };

        const handleSaveTeam = async (e) => {
          e.preventDefault();
          showToast("Updating team member...");
          try {
              await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveTeam', payload: editingTeam }) });
              setEditingTeam(null);
              showToast("Member saved!");
              fetchAllDataSilent();
          } catch(err) { showToast("Error updating."); }
        };

        const handleDeleteTeam = (id) => {
          requireConfirm("Remove this team member?", async () => {
            showToast("Removing...");
            setConfirmDialog(null);
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteTeam', payload: { id } }) });
                showToast("Member removed.");
                fetchAllDataSilent();
            } catch(err) { showToast("Error removing."); }
          });
        };

        const handleSaveSettings = async (e) => {
          e.preventDefault();
          showToast("Saving global settings...");
          try {
              await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveSettings', payload: settings }) });
              showToast("Settings updated!");
              fetchAllDataSilent();
          } catch(err) { showToast("Error saving settings."); }
        };

        
        // EXTREMELY SAFE DATA FILTERING TO PREVENT APP CRASHES
        const safeProducts = Array.isArray(products) ? products : [];
        const filteredProducts = safeProducts.filter(p => {
          if (!p) return false; // Prevent null crash
          const safeName = p.name || ''; // Prevent undefined .includes crash
          const matchesCat = filter === 'All' || p.category === filter;
          const matchesSearch = safeName.toLowerCase().includes((searchQuery || '').toLowerCase());
          return matchesCat && matchesSearch;
        });

        const safeDownloads = Array.isArray(downloads) ? downloads : [];
        const filteredDownloads = safeDownloads.filter(d => {
          if (!d) return false; // Prevent null crash
          const safeName = d.name || ''; // Prevent undefined .includes crash
          const matchesCat = downloadFilter === 'All' || d.category === downloadFilter;
          const matchesSearch = safeName.toLowerCase().includes((downloadSearch || '').toLowerCase());
          return matchesCat && matchesSearch;
        });

        if (appLoading) {
            return (
                <div className="flex items-center justify-center min-h-screen text-white p-4">
                    <div className="text-center space-y-6 p-8 bg-zinc-950/95 border border-amber-500/40 rounded-3xl glow-amber max-w-sm w-full font-mono shadow-2xl relative overflow-hidden">
                        <div className="w-16 h-16 bg-gradient-to-tr from-amber-600 to-amber-400 text-black rounded-2xl flex items-center justify-center mx-auto font-black text-2xl shadow-lg shadow-amber-500/30 animate-pulse">SH</div>
                        <div className="space-y-2">
                            <h2 className="text-sm font-black tracking-widest text-white uppercase">SOLUTION HUB</h2>
                            <p className="text-[11px] text-amber-400 font-semibold tracking-wider">SYSTEM INITIALIZING...</p>
                        </div>
                        <div className="space-y-2">
                            <div className="w-full h-1.5 bg-zinc-900 rounded-full overflow-hidden relative border border-amber-500/30">
                                <div className="absolute top-0 bottom-0 left-0 bg-gradient-to-r from-amber-600 to-amber-400 transition-all duration-300" style={{ width: `${loadProgress}%` }}></div>
                            </div>
                            <div className="flex justify-between text-[10px] text-gray-400 font-mono">
                                <span>LOADING...</span>
                                <span className="text-amber-400 font-bold">{loadProgress}%</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        return (
          <div className="min-h-screen flex flex-col justify-between text-gray-100">
            
            {/* Custom UI Notifications (Replaces alert) */}
            {toastMsg && (
                <div className="fixed top-20 right-4 z-[100] bg-amber-500 text-black px-6 py-3 rounded-xl font-bold shadow-2xl border border-amber-300 animate-[pulse_0.5s_ease-out]">
                    ⚡ {toastMsg}
                </div>
            )}

            {/* Custom Delete Confirm Modal (Replaces confirm) */}
            {confirmDialog && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                    <div className="bg-zinc-950 border border-amber-500/40 p-6 rounded-3xl max-w-sm w-full text-center space-y-6 shadow-2xl">
                        <div className="text-amber-500 text-4xl">⚠️</div>
                        <h3 className="font-bold text-white uppercase">{confirmDialog.message}</h3>
                        <div className="flex gap-4">
                            <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-zinc-800 text-white py-3 rounded-xl font-bold hover:bg-zinc-700">CANCEL</button>
                            <button onClick={confirmDialog.onConfirm} className="flex-1 bg-amber-500 text-black py-3 rounded-xl font-black hover:bg-amber-400">CONFIRM</button>
                        </div>
                    </div>
                </div>
            )}

            {/* HEADER */}
            <header className="bg-black/90 backdrop-blur-md shadow-2xl sticky top-0 z-50 border-b border-amber-500/20">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setPage('home')}>
                  {settings?.logo ? (
                    <img src={settings.logo} alt="Logo" className="w-11 h-11 rounded-2xl object-cover border border-amber-500/50 shadow-md" />
                  ) : (
                    <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-600 via-amber-500 to-yellow-300 text-black flex items-center justify-center font-black text-lg shadow-lg shadow-amber-500/20">SH</div>
                  )}
                  <div>
                    <h1 className="font-black text-base sm:text-lg leading-tight tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-100 to-amber-400 uppercase">SOLUTION HUB</h1>
                    <p className="text-[9px] sm:text-[10px] text-amber-400 tracking-widest font-bold uppercase">INNOVATIVE SOLUTIONS | UNMATCHED SERVICES</p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  {currentUser && <span className="text-xs text-amber-400 font-bold hidden sm:inline">👤 {currentUser.name || currentUser.username}</span>}
                  <button 
                    onClick={() => currentUser ? setCurrentUser(null) : setShowLoginModal(true)} 
                    title={currentUser ? "LOGOUT" : "ADMIN LOGIN"}
                    className="w-10 h-10 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-amber-500/30 text-amber-400 flex items-center justify-center shadow-lg transition transform active:scale-95 group"
                  >
                    <svg className="w-5 h-5 group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                  </button>
                </div>
              </div>

              {/* NAVIGATION */}
              <nav className="bg-zinc-950/95 border-t border-zinc-900/80 px-2 sm:px-4 py-2">
                <div className="max-w-7xl mx-auto flex items-center justify-start sm:justify-center gap-1.5 sm:gap-4 text-xs font-bold overflow-x-auto py-1 no-scrollbar">
                  <button onClick={() => setPage('home')} className={`px-4 py-2 rounded-xl transition whitespace-nowrap uppercase tracking-wider shrink-0 ${page === 'home' ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black shadow-lg font-black' : 'text-gray-300 hover:text-amber-400 hover:bg-white/5'}`}>🏠 HOME</button>

                    <h2 className="text-2xl sm:text-3xl font-black text-white uppercase">SOFTWARE & UTILITY DOWNLOADS</h2>
                    <p className="text-xs sm:text-sm text-gray-400">Download recommended repair utility tools and catalogs directly via Google Drive.</p>
                  </div>

                  {currentUser && (
                    <div className="flex justify-end">
                      <button onClick={() => setEditingDownload({ id: '', name: '', category: 'Utility Tool', size: '10 MB', image: '', link: '', desc: '' })} className="bg-amber-500 hover:bg-amber-400 text-black px-4 py-2 rounded-xl text-xs font-black shadow uppercase transition">
                        ➕ ADD NEW DOWNLOAD
                      </button>
                    </div>
                  )}

                  <div className="flex flex-col sm:flex-row gap-3 justify-between items-center bg-zinc-900/90 p-4 rounded-2xl border border-zinc-800 shadow-xl">
                    <input type="text" placeholder="Search downloads..." value={downloadSearch} onChange={(e) => setDownloadSearch(e.target.value)} className="w-full sm:w-80 p-2.5 bg-zinc-950 border border-zinc-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500" />
                    <div className="flex gap-2 overflow-x-auto w-full sm:w-auto pb-1 no-scrollbar">
                      {['All', ...new Set(safeDownloads.map(d => d?.category).filter(Boolean))].map(cat => (
                        <button key={cat} onClick={()=>setDownloadFilter(cat)} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${downloadFilter===cat?'bg-amber-500 text-black font-black':'bg-zinc-950 text-gray-300 border border-zinc-800 hover:border-amber-500/50'}`}>{cat}</button>
                      ))}
                    </div>
                  </div>

                  {filteredDownloads.length === 0 ? (
                    <div className="text-center py-20 text-gray-500 text-xs uppercase font-bold border border-dashed border-zinc-800 rounded-3xl bg-zinc-900/50">NO DOWNLOADS FOUND.</div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                      {filteredDownloads.map(item => (
                        <div key={item?.id} className="bg-zinc-900 rounded-3xl shadow-xl border border-zinc-800 overflow-hidden flex flex-col justify-between hover:border-amber-500/40 transition">
                          <div>
                            <div className="aspect-video sm:aspect-[4/3] bg-zinc-950 relative">
                              <img src={item?.image || 'https://placehold.co/600x400/18181b/f59e0b?text=Software'} alt={item?.name} className="w-full h-full object-cover" onError={(e)=>{e.target.src='https://placehold.co/600x400/18181b/f59e0b?text=Software';}} />
                              <div className="absolute top-3 right-3 bg-black/80 backdrop-blur text-white text-[10px] font-bold px-2 py-1 rounded-lg border border-zinc-700">{item?.size || 'N/A'}</div>
                            </div>
                            <div className="p-5 space-y-2">
                              <span className="text-[10px] bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-md font-bold border border-amber-500/20 uppercase tracking-wide">{item?.category || 'Utility'}</span>
                              <h3 className="font-bold text-sm text-white line-clamp-1">{item?.name || 'Unnamed Software'}</h3>
                              <p className="text-xs text-gray-400 line-clamp-2 leading-relaxed">{item?.desc || 'No description available'}</p>
                            </div>
                          </div>
                          <div className="p-5 pt-0 space-y-3">
                            <a href={item?.link || '#'} target="_blank" className="block w-full bg-amber-500 hover:bg-amber-400 text-black text-center py-3 rounded-xl text-xs font-black uppercase shadow-lg transition tracking-wide">📥 DOWNLOAD VIA DRIVE</a>
                            {currentUser && (
                              <div className="flex gap-2 pt-2 border-t border-zinc-800">
                                <button onClick={() => setEditingDownload(item)} className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white py-2 rounded-xl text-[10px] font-bold transition">Edit</button>
                                <button onClick={() => handleDeleteDownload(item?.id)} className="flex-1 bg-rose-600/20 hover:bg-rose-600/40 text-rose-400 py-2 rounded-xl text-[10px] font-bold transition border border-rose-500/30">Delete</button>
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* LOGIN MODAL */}
            {showLoginModal && (
              <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-[60]">
                <div className="bg-zinc-900 border border-amber-500/30 rounded-3xl max-w-sm w-full p-8 space-y-6 shadow-2xl relative">
                  <button onClick={() => setShowLoginModal(false)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-gray-400 hover:text-white font-bold transition">✕</button>
                  <div className="text-center space-y-2">
                    <div className="w-12 h-12 bg-amber-500 rounded-xl text-black flex items-center justify-center font-black text-xl mx-auto shadow-lg shadow-amber-500/30 mb-4">SH</div>
                    <h3 className="font-black text-lg text-white uppercase tracking-widest">SECURE LOGIN</h3>
                    <p className="text-[10px] text-gray-400 uppercase">Authorized Personnel Only</p>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-4 text-xs">
                    <div><input type="text" required placeholder="Admin Username" value={loginCreds.user} onChange={e=>setLoginCreds({...loginCreds, user:e.target.value})} className="w-full p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:outline-none focus:border-amber-500 transition" /></div>
                    <div><input type="password" required placeholder="Admin Password" value={loginCreds.pass} onChange={e=>setLoginCreds({...loginCreds, pass:e.target.value})} className="w-full p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:outline-none focus:border-amber-500 transition" /></div>
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black py-4 rounded-xl font-black shadow-lg uppercase transition tracking-wider">VERIFY & LOGIN</button>
                  </form>
                </div>
              </div>
            )}

            {/* EDIT PRODUCT MODAL */}
            {editingProduct && (
              <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-[60] overflow-y-auto">
                <div className="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative my-auto">
                  <button onClick={() => setEditingProduct(null)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-gray-400 hover:text-white font-bold transition">✕</button>
                  <h3 className="font-black text-base text-white uppercase border-b border-zinc-800 pb-3">{editingProduct.id ? 'EDIT PRODUCT' : 'ADD NEW PRODUCT'}</h3>
                  <form onSubmit={handleSaveProduct} className="space-y-4 text-xs">
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Product Name</label><input type="text" required value={editingProduct.name || ''} onChange={e=>setEditingProduct({...editingProduct, name:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Category</label><input type="text" required value={editingProduct.category || ''} onChange={e=>setEditingProduct({...editingProduct, category:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                        <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Price</label><input type="text" required value={editingProduct.price || ''} onChange={e=>setEditingProduct({...editingProduct, price:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    </div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Main Image URL</label><input type="url" required value={editingProduct.image || ''} onChange={e=>setEditingProduct({...editingProduct, image:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Description</label><textarea rows="3" required value={editingProduct.description || ''} onChange={e=>setEditingProduct({...editingProduct, description:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white"></textarea></div>
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black py-4 rounded-xl font-black uppercase transition mt-2 shadow-lg">SAVE PRODUCT DATA</button>
                  </form>
                </div>
              </div>
            )}

            {/* EDIT DOWNLOAD MODAL */}
            {editingDownload && (
              <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-[60] overflow-y-auto">
                <div className="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative my-auto">
                  <button onClick={() => setEditingDownload(null)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-gray-400 hover:text-white font-bold transition">✕</button>
                  <h3 className="font-black text-base text-white uppercase border-b border-zinc-800 pb-3">{editingDownload.id ? 'EDIT DOWNLOAD' : 'ADD NEW DOWNLOAD'}</h3>
                  <form onSubmit={handleSaveDownload} className="space-y-4 text-xs">
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Software Name</label><input type="text" required value={editingDownload.name || ''} onChange={e=>setEditingDownload({...editingDownload, name:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Category</label><input type="text" required value={editingDownload.category || ''} onChange={e=>setEditingDownload({...editingDownload, category:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                        <div><label className="block text-gray-400 mb-1 ml-1 font-bold">File Size</label><input type="text" required value={editingDownload.size || ''} onChange={e=>setEditingDownload({...editingDownload, size:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    </div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Google Drive Link</label><input type="url" required value={editingDownload.link || ''} onChange={e=>setEditingDownload({...editingDownload, link:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Image URL</label><input type="url" required value={editingDownload.image || ''} onChange={e=>setEditingDownload({...editingDownload, image:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Description</label><textarea rows="3" required value={editingDownload.desc || ''} onChange={e=>setEditingDownload({...editingDownload, desc:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white"></textarea></div>
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black py-4 rounded-xl font-black uppercase transition mt-2 shadow-lg">SAVE SOFTWARE LINK</button>
                  </form>
                </div>
              </div>
            )}

             {/* EDIT TEAM MODAL */}
             {editingTeam && (
              <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-[60] overflow-y-auto">
                <div className="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative my-auto">
                  <button onClick={() => setEditingTeam(null)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-gray-400 hover:text-white font-bold transition">✕</button>
                  <h3 className="font-black text-base text-white uppercase border-b border-zinc-800 pb-3">{editingTeam.id ? 'EDIT TEAM MEMBER' : 'ADD NEW MEMBER'}</h3>
                  <form onSubmit={handleSaveTeam} className="space-y-4 text-xs">
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Full Name</label><input type="text" required value={editingTeam.name || ''} onChange={e=>setEditingTeam({...editingTeam, name:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Role / Position</label><input type="text" required value={editingTeam.role || ''} onChange={e=>setEditingTeam({...editingTeam, role:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Photo URL</label><input type="url" required value={editingTeam.image || ''} onChange={e=>setEditingTeam({...editingTeam, image:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white" /></div>
                    <div><label className="block text-gray-400 mb-1 ml-1 font-bold">Short Description</label><textarea rows="3" required value={editingTeam.desc || ''} onChange={e=>setEditingTeam({...editingTeam, desc:e.target.value})} className="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white"></textarea></div>
                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-black py-4 rounded-xl font-black uppercase transition mt-2 shadow-lg">SAVE TEAM MEMBER</button>
                  </form>
                </div>
              </div>
            )}

            {/* PRODUCT DETAILS MODAL (VIEWER) */}
            {selectedProduct && (
              <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-[60]">
                <div className="bg-zinc-900 border border-amber-500/20 rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl relative">
                  <button onClick={() => setSelectedProduct(null)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-gray-400 hover:text-white font-bold transition z-10">✕</button>
                  
                  <div className="pr-8 border-b border-zinc-800 pb-3">
                    <span className="text-[10px] text-amber-400 font-bold uppercase tracking-wider">{selectedProduct.category || 'Category'}</span>
                    <h3 className="font-black text-xl text-white">{selectedProduct.name || 'Unnamed Product'}</h3>
                  </div>
                  
                  <div className="bg-zinc-950 rounded-2xl overflow-hidden border border-zinc-800 p-2">
                    <img src={selectedProduct.image || 'https://placehold.co/600x400/18181b/f59e0b?text=Image'} alt={selectedProduct.name} className="w-full h-48 sm:h-64 object-contain rounded-xl" onError={(e)=>{e.target.src='https://placehold.co/600x400/18181b/f59e0b?text=Image+Error';}} />
                  </div>

                  <div className="bg-zinc-950 p-4 rounded-2xl border border-zinc-800">
                    <p className="text-xs sm:text-sm text-gray-300 leading-relaxed">{selectedProduct.description || 'No detailed description available.'}</p>
                  </div>

                  <div className="flex justify-between items-center pt-2">
                    <div>
                        <span className="text-xs text-gray-500 uppercase font-bold block">Current Price</span>
                        <span className="text-2xl font-black text-amber-400">{selectedProduct.price || 'N/A'}</span>
                    </div>
                    {(() => {
                      const cleanNum = (settings?.whatsapp || '').replace(/\D/g, '');
                      const waLink = `https://wa.me/${cleanNum}?text=` + encodeURIComponent(`Hello Solution Hub, I want to purchase:\n*${selectedProduct.name}*\nPrice: ${selectedProduct.price}`);
                      return (
                        <a href={waLink} target="_blank" className="bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 text-white px-6 py-3.5 rounded-xl text-xs font-black shadow-lg shadow-emerald-900/50 transition uppercase flex gap-2 items-center">
                            <SocialIcons.WhatsApp /> SHOP NOW
                        </a>
                      );
                    })()}
                  </div>
                </div>
              </div>
            )}

            <footer className="bg-black text-white py-10 px-4 mt-16 border-t border-zinc-800/80 space-y-8 relative z-10">
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                <div className="flex items-center gap-3 cursor-pointer hover:scale-105 transition" onClick={() => setPage('home')}>
                  <div className="w-10 h-10 rounded-xl bg-amber-500 text-black flex items-center justify-center font-black text-sm shadow-lg shadow-amber-500/20">SH</div>
                  <div>
                    <span className="font-black text-sm tracking-widest uppercase block">SOLUTION HUB</span>
                    <span className="text-[9px] text-amber-500 uppercase tracking-widest font-bold">Tech & Studio Experts</span>
                  </div>
                </div>
                
                <div className="flex flex-wrap justify-center gap-6 text-xs font-bold uppercase tracking-wider text-gray-400">
                  <button onClick={() => setPage('home')} className="hover:text-amber-400 transition">Home</button>
                  <button onClick={() => setPage('shopping')} className="hover:text-amber-400 transition">Shop</button>
                  <button onClick={() => setPage('about')} className="hover:text-amber-400 transition">About</button>
                  <button onClick={() => setPage('contact')} className="hover:text-amber-400 transition">Contact</button>
                  <button onClick={() => setPage('download')} className="hover:text-amber-400 transition">Downloads</button>
                </div>

                <div className="flex gap-4 text-amber-400">
                  <a href={settings?.facebook || "#"} target="_blank" className="hover:text-white hover:scale-110 transition"><SocialIcons.Facebook /></a>
                  <a href={settings?.instagram || "#"} target="_blank" className="hover:text-white hover:scale-110 transition"><SocialIcons.Instagram /></a>
                  <a href={settings?.whatsapp ? `https://wa.me/${settings.whatsapp.replace(/\D/g, '')}` : "#"} target="_blank" className="hover:text-white hover:scale-110 transition"><SocialIcons.WhatsApp /></a>
                  <a href={settings?.youtube || "#"} target="_blank" className="hover:text-white hover:scale-110 transition"><SocialIcons.YouTube /></a>
                </div>
              </div>

              <div className="max-w-7xl mx-auto text-center text-[10px] text-gray-600 border-t border-zinc-900 pt-6 font-mono tracking-widest">
                <p>&copy; 2026 SOLUTION HUB. ALL RIGHTS RESERVED.</p>
              </div>
            </footer>

          </div>
        );
      }

      // Render the App
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
</body>
</html>

      let currentProgress = 0;
      const progressInterval = setInterval(() => {
        currentProgress += Math.floor(Math.random() * 12) + 8;
        if (currentProgress > 100) currentProgress = 100;
        const bar = document.getElementById('load-progress-bar');
        const text = document.getElementById('load-percentage');
        if(bar) bar.style.width = currentProgress + '%';
        if(text) text.innerText = currentProgress + '%';
        if (currentProgress === 100) {
          clearInterval(progressInterval);
          setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if(preloader) {
              preloader.style.opacity = '0';
              setTimeout(() => preloader.style.display = 'none', 600);
            }
          }, 200);
        }
      }, 50);
    </script>

                    <textarea placeholder="Description" value={editingDownload.desc} onChange={e=>setEditingDownload({...editingDownload, desc:e.target.value})} className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white"></textarea>
                    <button type="submit" className="w-full bg-amber-500 text-black py-3 rounded-xl font-black uppercase">SAVE DOWNLOAD</button>
                  </form>
                </div>
              </div>
            )}

            {/* EDIT TEAM MODAL */}
            {editingTeam && (
              <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                  <button onClick={() => setEditingTeam(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white font-bold">✕</button>
                  <h3 className="font-black text-base text-white uppercase">EDIT / ADD TEAM MEMBER</h3>
                  <form onSubmit={handleSaveTeam} className="space-y-3 text-xs">
                    <input type="text" placeholder="Name" required value={editingTeam.name} onChange={e=>setEditingTeam({...editingTeam, name:e.target.value})} className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white" />
                    <input type="text" placeholder="Role (e.g. Owner)" required value={editingTeam.role} onChange={e=>setEditingTeam({...editingTeam, role:e.target.value})} className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white" />
                    <div>
                      <label className="block text-[10px] text-gray-400 mb-1">Upload Photo</label>
                      <input type="file" accept="image/*" onChange={e => handleImageUpload(e, (base64) => setEditingTeam({...editingTeam, image: base64}))} className="w-full text-xs text-gray-400" />
                    </div>
                    <input type="text" placeholder="Or Image URL" value={editingTeam.image} onChange={e=>setEditingTeam({...editingTeam, image:e.target.value})} className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white" />
                    <textarea placeholder="Description" value={editingTeam.desc} onChange={e=>setEditingTeam({...editingTeam, desc:e.target.value})} className="w-full p-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-white"></textarea>
                    <button type="submit" className="w-full bg-amber-500 text-black py-3 rounded-xl font-black uppercase">SAVE MEMBER</button>
                  </form>
                </div>
              </div>
            )}

            {/* PRODUCT DETAILS MODAL */}
            {selectedProduct && (
              <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
                  <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-gray-300 hover:text-white font-bold">✕</button>
                  <h3 className="font-black text-lg text-white pr-6">{selectedProduct.name}</h3>
                  <img src={selectedProduct.image} alt={selectedProduct.name} className="w-full h-52 object-cover rounded-2xl bg-zinc-950 border border-zinc-800" />
                  <p className="text-xs text-gray-300 leading-relaxed">{selectedProduct.description}</p>
                  <div className="flex justify-between items-center pt-2">
                    <span className="text-base font-black text-amber-400">{selectedProduct.price}</span>
                    {(() => {
                      const cleanNum = (settings.whatsapp || '').replace(/\D/g, '');
                      const waLink = `https://wa.me/${cleanNum}?text=` + encodeURIComponent(`Hello Solution Hub, I want to purchase: ${selectedProduct.name} (${selectedProduct.price})`);
                      return (
                        <a href={waLink} target="_blank" className="bg-gradient-to-r from-emerald-600 to-green-600 text-white px-5 py-2.5 rounded-xl text-xs font-black shadow-lg transition uppercase">SHOP NOW</a>
                      );
                    })()}
                  </div>
                </div>
              </div>
            )}

            {/* Footer */}
            <footer className="bg-black text-white py-8 px-4 mt-16 border-t border-zinc-800/80 space-y-6">
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setPage('home')}>
                  <div className="w-9 h-9 rounded-xl bg-amber-500 text-black flex items-center justify-center font-black text-sm">SH</div>
                  <span className="font-black text-sm tracking-widest uppercase">SOLUTION HUB</span>
                </div>
                <div className="flex flex-wrap justify-center gap-4 text-xs font-bold uppercase tracking-wider text-gray-400">
                  <button onClick={() => setPage('home')} className="hover:text-amber-400 transition">HOME</button>
                  <button onClick={() => setPage('shopping')} className="hover:text-amber-400 transition">SHOPPING</button>
                  <button onClick={() => setPage('about')} className="hover:text-amber-400 transition">ABOUT US</button>
                  <button onClick={() => setPage('contact')} className="hover:text-amber-400 transition">CONTACT US</button>
                  <button onClick={() => setPage('download')} className="hover:text-amber-400 transition">DOWNLOAD</button>
                </div>
                <div className="flex gap-3 text-amber-400">
                  <a href={settings.facebook} target="_blank" className="hover:scale-110 transition"><SocialIcons.Facebook /></a>
                  <a href={settings.instagram} target="_blank" className="hover:scale-110 transition"><SocialIcons.Instagram /></a>
                  <a href={`https://wa.me/${(settings.whatsapp||'').replace(/\D/g,'')}`} target="_blank" className="hover:scale-110 transition"><SocialIcons.WhatsApp /></a>
                  <a href={settings.youtube} target="_blank" className="hover:scale-110 transition"><SocialIcons.YouTube /></a>
                  <a href={settings.tiktok} target="_blank" className="hover:scale-110 transition"><SocialIcons.TikTok /></a>
                </div>
              </div>
              <div className="max-w-7xl mx-auto text-center text-[11px] text-gray-500 border-t border-zinc-900 pt-4 uppercase">
                <p>&copy; 2026 SOLUTION HUB. ALL RIGHTS RESERVED.</p>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

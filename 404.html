<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solution Hub | Redirecting...</title>
    <script>
        const pathSegmentsToKeep = 0;
        const l = window.location;
        let pathname = l.pathname.slice(1).split('/');
        if (pathSegmentsToKeep > 0) {
            pathname = pathname.slice(pathSegmentsToKeep);
        }
        const targetUrl = l.protocol + '//' + l.host + (pathSegmentsToKeep > 0 ? '/' + l.pathname.split('/')[1] : '') + '/?p=/' + pathname.join('/');
        window.location.replace(targetUrl);
    </script>
</head>
<body style="background:#030712; color:#fff; height:100vh; display:flex; align-items:center; justify-content:center; font-family:sans-serif;">
    <p>Redirecting to Solution Hub...</p>
</body>
</html>
